# Fixed project name: volume names (telebot-photos_bot-data, ...) must not depend on the
# directory the repository was cloned into.
name: telebot-photos

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Self-hosted Bot API server: lets the bot download files of up to 2 GB.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:10.3
    restart: unless-stopped
    logging: *logging
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Define TELEGRAM_API_ID en .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Define TELEGRAM_API_HASH en .env}
      TELEGRAM_LOCAL: "1"
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api

  bot:
    # Published by .github/workflows/deploy.yml. To build it yourself instead, add
    # -f docker-compose.build.yml (see DEPLOY.md).
    image: ${BOT_IMAGE:-ghcr.io/jpchaconr/telebot-photos}:${BOT_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      BOT_API_URL: http://telegram-bot-api:8081
    depends_on:
      - telegram-bot-api
    # Time to finish the current database writes on shutdown.
    stop_grace_period: 30s
    volumes:
      # Must be mounted at the same path as in telegram-bot-api (local mode).
      - bot-api-data:/var/lib/telegram-bot-api
      - bot-data:/data

  # HTTPS with automatic certificates for the OAuth callbacks and the public pages.
  # Only Caddy publishes ports. Ports published by Docker bypass ufw, so do not add
  # "ports:" to the other services (bind any debug port to 127.0.0.1).
  caddy:
    image: caddy:2.11
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN en .env}
      ACME_EMAIL: ${ACME_EMAIL:?Define ACME_EMAIL en .env (cuenta de Let's Encrypt)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Keep this volume: re-issuing certificates counts against Let's Encrypt limits.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - bot

volumes:
  bot-api-data:
  bot-data:
  caddy-data:
  caddy-config:
