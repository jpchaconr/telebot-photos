services:
  # Self-hosted Bot API server: lets the bot download files of up to 2 GB.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:10.3
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Define TELEGRAM_API_ID en .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Define TELEGRAM_API_HASH en .env}
      TELEGRAM_LOCAL: "1"
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      BOT_API_URL: http://telegram-bot-api:8081
    depends_on:
      - telegram-bot-api
    volumes:
      # Must be mounted at the same path as in telegram-bot-api (local mode).
      - bot-api-data:/var/lib/telegram-bot-api
      - bot-data:/data

  # HTTPS with automatic certificates for the OAuth callbacks.
  caddy:
    image: caddy:2.11
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN en .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - bot

volumes:
  bot-api-data:
  bot-data:
  caddy-data:
  caddy-config:
