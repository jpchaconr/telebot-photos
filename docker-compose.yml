# Fixed project name: volume names (telebot-photos_bot-data, ...) must not depend on the
# directory the repository was cloned into.
name: telebot-photos

# On its own this file uses Telegram's cloud Bot API: files of up to 20 MB. For files of up
# to 2 GB, add docker-compose.bot-api.yml (deploy/install.sh writes COMPOSE_FILE in .env).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  bot:
    # Published by .github/workflows/deploy.yml. To build it yourself instead, add
    # -f docker-compose.build.yml (see DEPLOY.md).
    image: ${BOT_IMAGE:-ghcr.io/jpchaconr/telebot-photos}:${BOT_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    env_file: .env
    # Time to finish the current database writes on shutdown.
    stop_grace_period: 30s
    volumes:
      - bot-data:/data

  # HTTPS with automatic certificates for the OAuth callbacks and the public pages.
  # Only Caddy publishes ports. Ports published by Docker bypass ufw, so do not add
  # "ports:" to the other services (bind any debug port to 127.0.0.1).
  caddy:
    image: caddy:2.11
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN en .env}
      ACME_EMAIL: ${ACME_EMAIL:?Define ACME_EMAIL en .env (cuenta de Let's Encrypt)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Keep this volume: re-issuing certificates counts against Let's Encrypt limits.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - bot

volumes:
  bot-data:
  caddy-data:
  caddy-config:
