[project]
name = "telebot-photos"
version = "0.1.0"
description = "Bot de Telegram que guarda la multimedia de cada grupo en su propio almacenamiento en la nube"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot~=22.8",
    "aiohttp~=3.14",
    "httpx~=0.28",
    "boto3~=1.43",
    "aiosqlite~=0.22",
    "cryptography>=44",
    "pydantic-settings~=2.16",
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.1",
    "pytest-asyncio~=1.4",
    "respx~=0.23",
    "moto[s3,server]~=5.2",
    "ruff",
]

[project.scripts]
telebot-photos = "telebot_photos.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telebot_photos"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:If 'per_message=False':telegram.warnings.PTBUserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC"]
